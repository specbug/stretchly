name: Stretchly
options:
  bundleIdPrefix: net.hovancik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  preGenCommand: node scripts/sync-shared.mjs
packages:
  StretchlyCore:
    path: StretchlyCore
settings:
  base:
    MARKETING_VERSION: "1.22.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Stretchly:
    type: application
    platform: iOS
    sources:
      - path: Stretchly
        excludes:
          - Generated/**
      - path: Stretchly/Generated/Locales
        type: folder
        buildPhase: resources
      - path: Stretchly/Generated/Fonts
        buildPhase: resources
      - path: Stretchly/Generated/Sounds
        buildPhase: resources
      - path: Stretchly/Generated/Shared.xcassets
    dependencies:
      - package: StretchlyCore
    info:
      path: Stretchly/Generated/Info.plist
      properties:
        CFBundleDisplayName: Stretchly
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - NotoSans-Light.ttf
          - NotoSans-Regular.ttf
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Stretchly/Generated/Stretchly.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hovancik.stretchly
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
